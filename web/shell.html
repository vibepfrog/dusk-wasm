<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dusk - Twilight Princess (Web)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A//www.w3.org/2000/svg'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20fill%3D'%230b0b0d'/%3E%3Ctext%20x%3D'16'%20y%3D'22'%20font-family%3D'sans-serif'%20font-size%3D'18'%20fill%3D'%236cb6ff'%20text-anchor%3D'middle'%3ED%3C/text%3E%3C/svg%3E">
    <script src="coi-serviceworker.js"></script>
    <script src="iso_bridge.js" defer></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: #0b0b0d; color: #e6e6e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas { display: block; position: absolute; inset: 0; margin: auto;
            width: 100vw; height: 100vh; background: #000; outline: none; }
        #boot-status { position: fixed; left: 12px; bottom: 10px; font-size: 12px;
            color: #888; pointer-events: none; font-variant-numeric: tabular-nums; }
        #drop-zone { position: fixed; inset: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            background: rgba(11, 11, 13, 0.96); }
        #drop-zone.hidden { display: none; }
        #drop-zone.dragging .drop-card { border-color: #6cb6ff; background: #1a2230; }
        .drop-card { box-sizing: border-box; width: min(560px, 92vw); padding: 32px 28px;
            border: 2px dashed #3a3a42; border-radius: 12px; background: #16161a;
            text-align: center; transition: border-color 0.12s, background 0.12s; }
        .drop-card h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
        .drop-card .subtitle { margin: 0 0 22px; font-size: 13px; color: #9a9aa3; }
        .drop-card .prompt { font-size: 15px; margin: 18px 0 14px; }
        .pick-btn { display: inline-block; padding: 9px 18px; background: #2a2a32;
            color: #e6e6e6; border: 1px solid #44444e; border-radius: 6px;
            font: inherit; font-size: 14px; cursor: pointer; }
        .pick-btn:hover { background: #34343c; }
        .pick-btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
        #iso-file { display: none; }
        .disc-line { margin-top: 22px; font-size: 11px; color: #888; line-height: 1.55; }
        .disc-line code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px; color: #b8b8c2; user-select: all; }
        #import-status { margin-top: 22px; min-height: 18px; font-size: 13px; color: #c8c8d0; }
        #import-status.error { color: #ff6b6b; white-space: pre-wrap; text-align: left;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px; line-height: 1.5; }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="drop-zone">
        <div class="drop-card">
            <h1>Dusk</h1>
            <div class="subtitle">A web port of The Legend of Zelda: Twilight Princess (GameCube)</div>

            <div class="prompt">Drop your Twilight Princess GameCube disc image here</div>
            <label class="pick-btn" for="iso-file">Choose file</label>
            <input id="iso-file" type="file" accept=".iso,.gcm,.ciso">

            <div class="disc-line">
                Supported: USA <code>GZ2E01</code> or EUR <code>GZ2P01</code>, as ISO/GCM or CISO.<br>
                The file stays on your device and is read incrementally.
            </div>

            <div id="import-status"></div>
        </div>
    </div>

    <div id="boot-status"></div>

    <script>
    (function () {
        var dropZone = document.getElementById('drop-zone');
        var fileInput = document.getElementById('iso-file');
        var statusEl = document.getElementById('import-status');
        var bootStatusEl = document.getElementById('boot-status');
        var pickButton = dropZone.querySelector('.pick-btn');
        var importing = false;

        function setStatus(text, isError) {
            statusEl.textContent = text || '';
            statusEl.classList.toggle('error', !!isError);
        }
        function phaseLabel(name) {
            switch (name) {
                case 'header-check': return 'Checking disc image container...';
                case 'worker-handoff': return 'Preparing bounded disc streaming...';
                case 'done': return 'Done.';
                default: return name;
            }
        }

        function exceptionDetail(err) {
            var detail = String(err && err.message ? err.message : err);
            if (typeof Module.getExceptionMessage === 'function' && err && typeof err === 'object') {
                try {
                    var message = Module.getExceptionMessage(err);
                    if (message && message.length >= 2) detail = '[' + message[0] + '] ' + message[1];
                } catch (_) { /* not a wasm exception */ }
            }
            return detail;
        }

        function startImport(file) {
            if (importing || fileInput.disabled) return;
            importing = true;
            setStatus('Starting...', false);

            window.duskIsoImport.importIso(file, {
                onPhase: function (name) { setStatus(phaseLabel(name), false); },
            }).then(function (result) {
                setStatus('Loaded. Starting game.', false);
                dropZone.classList.add('hidden');
                document.getElementById('canvas').focus();
                try {
                    Module.callMain([result.path]);
                } catch (mainErr) {
                    var detail = exceptionDetail(mainErr);
                    console.error('[dusk] main() threw:', detail);
                    console.error('[dusk] stack:', (mainErr && mainErr.stack) || '<no stack>');
                    setStatus('main() threw: ' + detail, true);
                    dropZone.classList.remove('hidden');
                }
            }).catch(function (err) {
                importing = false;
                console.error('[dusk] disc import failed:', err);
                setStatus(String(err && err.message ? err.message : err), true);
            });
        }

        fileInput.addEventListener('change', function (event) {
            var file = event.target.files && event.target.files[0];
            if (file) startImport(file);
        });

        ['dragenter', 'dragover'].forEach(function (eventName) {
            dropZone.addEventListener(eventName, function (event) {
                event.preventDefault();
                event.stopPropagation();
                if (!fileInput.disabled) dropZone.classList.add('dragging');
            });
        });
        ['dragleave', 'drop'].forEach(function (eventName) {
            dropZone.addEventListener(eventName, function (event) {
                event.preventDefault();
                event.stopPropagation();
                if (eventName === 'dragleave' && event.target !== dropZone) return;
                dropZone.classList.remove('dragging');
            });
        });
        dropZone.addEventListener('drop', function (event) {
            var file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
            if (file) startImport(file);
        });

        // Each tab gets an isolated channel. The query parameter makes the
        // channel name available when the pthread bootstrap reloads index.js.
        var discChannel = 'dusk-browser-disc-' + (
            globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function'
                ? globalThis.crypto.randomUUID()
                : Date.now().toString(36) + Math.random().toString(36).slice(2)
        );

        var Module = {
            noInitialRun: true,
            arguments: ['/dusk/browser-disc'],
            duskDiscChannel: discChannel,
            mainScriptUrlOrBlob: 'index.js?duskDiscChannel=' + encodeURIComponent(discChannel),
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener('webglcontextlost', function (event) {
                    event.preventDefault();
                    setStatus('GPU context lost. Please reload the page.', true);
                    dropZone.classList.remove('hidden');
                }, false);
                return canvas;
            })(),
            setStatus: function (text) { bootStatusEl.textContent = text || ''; },
            print: function (text) { console.log(text); },
            printErr: function (text) { console.warn(text); },
            onAbort: function (reason) {
                var error = new Error('abort: ' + reason);
                console.error('[dusk] onAbort:', reason);
                console.error('[dusk] wasm stack at abort:\n' + (error.stack || '<no stack>'));
            },
            onRuntimeInitialized: function () { bootStatusEl.textContent = ''; },
        };
        window.Module = Module;

        if (!window.crossOriginIsolated || typeof SharedArrayBuffer !== 'function') {
            fileInput.disabled = true;
            pickButton.setAttribute('aria-disabled', 'true');
            setStatus(
                'Threading is unavailable. This page must be served with COOP and COEP security headers.',
                true
            );
        } else if (typeof WebAssembly.Suspending !== 'function' ||
                   typeof WebAssembly.promising !== 'function') {
            fileInput.disabled = true;
            pickButton.setAttribute('aria-disabled', 'true');
            setStatus(
                'WebAssembly JSPI is unavailable. Use a current Chromium browser with JSPI enabled.',
                true
            );
        } else if (!navigator.gpu) {
            fileInput.disabled = true;
            pickButton.setAttribute('aria-disabled', 'true');
            setStatus('WebGPU is unavailable. Use a current browser with WebGPU enabled.', true);
        } else if (typeof Module.canvas.transferControlToOffscreen !== 'function') {
            fileInput.disabled = true;
            pickButton.setAttribute('aria-disabled', 'true');
            setStatus('OffscreenCanvas is unavailable. This browser cannot run threaded WebGPU rendering.', true);
        }

        window.onerror = function (message, source, line, column, error) {
            bootStatusEl.textContent = 'error - check console';
            console.error('[dusk] window.onerror:', message);
            if (error && error.stack) console.error('[dusk] window.onerror stack:\n' + error.stack);
        };
        window.addEventListener('unhandledrejection', function (event) {
            console.error('[dusk] unhandledrejection:', event.reason);
            if (event.reason && event.reason.stack) {
                console.error('[dusk] unhandledrejection stack:\n' + event.reason.stack);
            }
        });
    })();
    </script>

    {{{ SCRIPT }}}
</body>
</html>
