name: Publish existing build to Cloudflare Pages

# Deliberately manual: preparation does not change GitHub Pages publishing.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful production web.yml run whose github-pages artifact to publish
        required: true
        type: string
      target:
        description: Preview first; production after validation
        required: true
        type: choice
        default: preview
        options: [preview, production]

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: cloudflare-${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate selected build
        id: build
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.BUILD_RUN_ID)) throw new Error('Invalid build run ID');
            const run_id = Number(process.env.BUILD_RUN_ID);
            if (!Number.isSafeInteger(run_id)) throw new Error('Invalid build run ID');
            const repo = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id });
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.event !== 'push' || run.head_branch !== 'wasm-port' ||
                run.path !== '.github/workflows/web.yml' ||
                run.head_repository?.full_name !== `${repo.owner}/${repo.repo}`) {
              throw new Error('Choose a successful production wasm-port web.yml push run, not a PR artifact');
            }
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...repo, run_id });
            const artifacts = data.artifacts.filter(a => a.name === 'github-pages' && !a.expired);
            if (artifacts.length !== 1) throw new Error('One unexpired github-pages artifact is required');
            core.setOutput('sha', run.head_sha);
            core.notice(`Reusing ${run.head_sha} from run ${run_id}; no recompilation`);

      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: downloaded
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Unpack and validate complete upload
        run: |
          mkdir site
          tar --no-same-owner -xf downloaded/artifact.tar -C site
          node web/check_build.mjs site --cloudflare

      - name: Validate Cloudflare destination
        id: destination
        uses: actions/github-script@v7
        env:
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: ${{ inputs.target }}
        with:
          script: |
            const { CF_ACCOUNT, CF_PROJECT, CF_TOKEN, DEPLOY_TARGET } = process.env;
            if (!/^[a-f0-9]{32}$/i.test(CF_ACCOUNT || '') ||
                !/^[a-z0-9][a-z0-9-]*$/.test(CF_PROJECT || '') || !CF_TOKEN) {
              throw new Error('Configure account/project variables and API-token secret in the selected environment');
            }
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PROJECT}`, {
              headers: { Authorization: `Bearer ${CF_TOKEN}` }
            });
            const data = await response.json();
            if (!response.ok || !data.success || data.result?.production_branch !== 'wasm-port') {
              throw new Error('Pages project must exist and use wasm-port as its production branch');
            }
            if (!['preview', 'production'].includes(DEPLOY_TARGET)) throw new Error('Invalid deployment target');
            core.setOutput('branch', DEPLOY_TARGET === 'production' ? 'wasm-port' : 'migration-preview');

      - name: Upload validated static assets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            pages deploy site
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ steps.destination.outputs.branch }}
            --commit-hash=${{ steps.build.outputs.sha }}

      - name: Record deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          echo "Cloudflare URL: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $BUILD_SHA" >> "$GITHUB_STEP_SUMMARY"
